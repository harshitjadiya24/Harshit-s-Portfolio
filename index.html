<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040817" />
    <!-- Set the theme before first paint so there is no dark/light flash. Mirrors src/theme.ts. -->
    <script>
      (function () {
        var t
        try { t = localStorage.getItem("theme") } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f3f6fa")
      })()
    </script>
    <meta
      name="description"
      content="Harshit Jadiya — AI engineer & architect. Intelligent products, expressive interfaces, and systems that feel human."
    />
    <title>Harshit Jadiya — AI Engineer / Architect</title>
    <link rel="preload" href="/fonts/clash-display-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/clash-display-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
